<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flask To Do Lab</title>
<style>body{font:17px/1.5 system-ui;background:#101726;color:#f2f5ff;max-width:780px;margin:8vh auto;padding:24px}h1{font-size:44px}input,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #56688b}button{background:#acd0ff;color:#132343;cursor:pointer}input{flex:1;min-width:0}form{display:flex;gap:10px}li{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid #39445f}li span{flex:1;overflow-wrap:anywhere}ul{padding:0}small{color:#b4c0d8}.done{text-decoration:line-through;color:#a4b0c8}.delete{background:transparent;color:#ffc0c0}@media(max-width:500px){li{flex-wrap:wrap}li span{flex-basis:100%}}</style></head>
<body><small>EXPERIMENT 16 / SINGLE USER LOCAL DEMO</small><h1>My To Do List</h1><p>Add work, mark it complete, and keep it after a restart.</p>
<form method="post"><label for="task">Task</label><input id="task" name="task" maxlength="200" required placeholder="Read the software engineering lab"><button>Add task</button></form>
<ul>{% for todo in todos %}<li><span class="{{ 'done' if todo.done else '' }}">{{ todo.task }}</span><form method="post" action="{{ url_for('toggle',task_id=todo.id) }}"><button>{{ 'Reopen' if todo.done else 'Complete' }}</button></form><form method="post" action="{{ url_for('delete',task_id=todo.id) }}"><button class="delete">Delete</button></form></li>{% else %}<li>No tasks yet. Add your first task above.</li>{% endfor %}</ul></body></html>
