<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kubernetes Three Tier Lab</title><style>body{background:#11192a;color:#e8f0ff;font:18px/1.6 system-ui;max-width:820px;margin:8vh auto;padding:30px}h1{font-size:42px}button{padding:12px 22px;border:0;border-radius:8px;background:#accfff;font:inherit}pre{padding:20px;background:#20314a;white-space:pre-wrap}small{color:#accfff}</style></head><body><small>EXPERIMENT 18</small><h1>Three services.<br>One working request.</h1><p>Nginx serves this page and forwards API requests to Flask. Flask records a visit in MySQL.</p><button id="refresh">Check services</button><pre id="output" role="status" aria-live="polite">Choose Check services to test the complete flow.</pre><script>
document.querySelector('#refresh').addEventListener('click',async()=>{const output=document.querySelector('#output');output.textContent='Checking…';try{const r=await fetch('/api/status');const data=await r.json();output.textContent=JSON.stringify(data,null,2);if(!r.ok)output.textContent='Service not ready ('+r.status+')\n'+output.textContent;}catch(e){output.textContent='Could not reach the backend. Check pod readiness and the Nginx proxy.';}});
</script></body></html>
