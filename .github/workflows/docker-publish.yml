name: Publish lab images to Docker Hub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/14-github-actions-docker/**'
      - 'experiments/19-flask-cicd/**'
      - '.github/workflows/docker-publish.yml'
permissions:
  contents: read
jobs:
  publish:
    if: vars.DOCKERHUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - context: experiments/14-github-actions-docker
            image: csa10-actions-app
          - context: experiments/19-flask-cicd
            image: csa10-flask-cicd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test before publishing
        run: |
          pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
